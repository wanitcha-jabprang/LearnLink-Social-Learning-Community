
version: "3.9"

services:
  db:
    image: mysql:8.4
    container_name: learnlink-db
    restart: always

    environment:
      MYSQL_DATABASE: learnlink
      MYSQL_USER: learnlink
      MYSQL_PASSWORD: learnlink123
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: learnlink-redis
    restart: always

    ports:
      - "127.0.0.1:6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    container_name: learnlink-web

    command: python manage.py runserver 0.0.0.0:8000

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy

    env_file:
      - .env

    environment:
      REDIS_URL: redis://redis:6379/1

    working_dir: /app/src

volumes:
  mysql_data:
