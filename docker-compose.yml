version: "3.9"

services:
  db:
    image: mysql:8.4
    container_name: learnlink-db
    restart: always

    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    container_name: learnlink-web

    command: python manage.py runserver 0.0.0.0:8000

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_started

    env_file:
      - .env

    working_dir: /app/src

  login-attempt-cleanup:
    build: .
    container_name: learnlink-login-attempt-cleanup
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          if python manage.py cleanup_login_attempts --days 30; then
            sleep 86400
          else
            sleep 60
          fi
        done
    volumes:
      - .:/app
    working_dir: /app/src
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
    depends_on:
      db:
        condition: service_started
volumes:
  mysql_data:
