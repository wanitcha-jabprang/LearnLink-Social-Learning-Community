
services:
  db:
    image: mysql:8.4
    container_name: learnlink-db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  clamav:
    image: clamav/clamav:1.4
    container_name: learnlink-clamav
    restart: always
    environment:
      CLAMD_CONF_StreamMaxLength: 120M
      CLAMD_CONF_MaxFileSize: 110M
      CLAMD_CONF_MaxScanSize: 200M
    volumes:
      - clamav_data:/var/lib/clamav
    expose:
      - "3310"

  web:
    build: .
    container_name: learnlink-web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - clamav
    env_file:
      - .env
    working_dir: /app/src
    environment:
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310

volumes:
  mysql_data:
  clamav_data:
