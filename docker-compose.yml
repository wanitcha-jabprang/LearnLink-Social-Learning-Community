version: "3.9"

services:
  db:
    image: mysql:8.4
    container_name: learnlink-db
    restart: always

    environment:
      MYSQL_DATABASE: learnlink
      MYSQL_USER: learnlink
      MYSQL_PASSWORD: learnlink123
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql


  web:
    build: .

    container_name: learnlink-web

    command: python manage.py runserver 0.0.0.0:8000

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    depends_on:
      - db

    env_file:
      - .env

    working_dir: /app/src

volumes:
  mysql_data:
