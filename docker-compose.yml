version: "3.9"

services:
  db:
    image: mysql:8.4
    container_name: learnlink-db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  clamav:
    image: clamav/clamav:1.4
    container_name: learnlink-clamav
    restart: always
    environment:
      CLAMD_CONF_StreamMaxLength: 120M
      CLAMD_CONF_MaxFileSize: 110M
      CLAMD_CONF_MaxScanSize: 200M
    volumes:
      - clamav_data:/var/lib/clamav
    expose:
      - "3310"

  web:
    build: .
    container_name: learnlink-web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
    - .:/app
    ports:
    - "8000:8000"
    depends_on:
    - db
    - clamav
    env_file:
    - .env
  working_dir: /app/src
  environment:
    CLAMAV_HOST: clamav
    CLAMAV_PORT: 3310


    env_file:
      - .env
    working_dir: /app/src
    environment:
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310

  login-attempt-cleanup:
    build: .
    container_name: learnlink-login-attempt-cleanup
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          if python manage.py cleanup_login_attempts --days 30 && python manage.py cleanup_audit_events --days 90; then
            sleep 86400
          else
            sleep 60
          fi
        done
    volumes:
      - .:/app
    working_dir: /app/src
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
    depends_on:
      db:
        condition: service_started
volumes:
  mysql_data:
  clamav_data:
