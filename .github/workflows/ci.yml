name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: Django, SAST, and SCA
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes default-libmysqlclient-dev build-essential pkg-config

      - name: Install Python dependencies and scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt bandit pip-audit

      - name: Run Django system checks
        working-directory: src
        run: python manage.py check --settings=config.test_settings

      - name: Check for missing migrations
        working-directory: src
        run: python manage.py makemigrations --check --dry-run --settings=config.test_settings

      - name: Run Django tests
        working-directory: src
        run: python manage.py test --settings=config.test_settings

      - name: Run SAST with Bandit
        run: bandit -r src -x "*/migrations/*" -ll

      - name: Run SCA with pip-audit
        run: pip-audit -r requirements.txt

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build --tag learnlink:pull-request .
