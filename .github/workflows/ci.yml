name: CI and Railway deployment

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: Django, SAST, and SCA
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes default-libmysqlclient-dev build-essential pkg-config

      - name: Install Python dependencies and scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt bandit pip-audit

      - name: Run Django system checks
        working-directory: src
        run: python manage.py check --settings=config.test_settings

      - name: Check for missing migrations
        working-directory: src
        run: python manage.py makemigrations --check --dry-run --settings=config.test_settings

      - name: Run Django tests
        working-directory: src
        run: python manage.py test --settings=config.test_settings

      - name: Run SAST with Bandit
        run: bandit -r src -x "*/migrations/*" -ll

      - name: Run SCA with pip-audit
        run: pip-audit -r requirements.txt

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build --tag learnlink:pull-request .

  deploy-railway:
    name: Deploy to Railway
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - python-checks
      - docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Railway configuration
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT }}
        run: |
          test -n "$RAILWAY_TOKEN" || { echo "::error::Add RAILWAY_TOKEN as a GitHub Actions secret."; exit 1; }
          test -n "$RAILWAY_SERVICE_ID" || { echo "::error::Add RAILWAY_SERVICE_ID as a GitHub Actions variable."; exit 1; }
          test -n "$RAILWAY_ENVIRONMENT" || { echo "::error::Add RAILWAY_ENVIRONMENT as a GitHub Actions variable."; exit 1; }

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy application
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT }}
        run: railway up --ci --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT"
