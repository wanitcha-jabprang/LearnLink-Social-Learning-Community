{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8fafc">
    <title>{% block title %}LearnLink | เรียนรู้ไปด้วยกัน{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/app.css' %}?v=20261023-profile-communities">
</head>
<body{% if request.user.is_authenticated %} class="is-authenticated" data-current-user="{{ request.user.full_name|default:request.user.username }}"{% endif %}>
    {% if request.user.is_authenticated and messages %}
    <div class="site-messages" role="status" aria-live="polite">
        {% for message in messages %}<p class="site-message {{ message.tags }}">{{ message }}</p>{% endfor %}
    </div>
    {% endif %}
    <main class="auth-shell" id="feed">
        {% block content %}{% endblock %}
    </main>
    {% include "includes/footer.html" %}
</body>
</html>
